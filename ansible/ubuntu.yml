---
- name: Install packages
  apt:
    name:
      - git
      - stow
      - curl
      - openssh-client
      - vim
      - tmux
      - fzf
      - tree
    state: present
    update_cache: true
  become: true

- name: Restow dotfiles
  shell: stow --restow -t {{ ansible_facts['user_dir'] }} */
  args:
    chdir: "{{ ansible_facts['user_dir'] }}/machine-setup/env"
  become: false
