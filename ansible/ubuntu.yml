---
- name: Install packages
  become: true
  apt:
    name:
      - git
      - stow
      - curl
      - openssh-client
      - vim
      - tmux
      - fzf
      - tree
      # Microsoft apt
      - gpg
      - apt-transport-https
    state: present
    update_cache: true


- name: Ensure apt keyrings directory exists
  become: true
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"


- name: Remove old VS Code repo list
  become: true
  file:
    path: /etc/apt/sources.list.d/vscode.list
    state: absent


- name: Remove old raw Microsoft key
  become: true
  file:
    path: /etc/apt/keyrings/microsoft.asc
    state: absent


- name: Download Microsoft signing key
  become: true
  get_url:
    url: https://packages.microsoft.com/keys/microsoft.asc
    dest: /tmp/microsoft.asc
    mode: "0644"


- name: Dearmor Microsoft signing key
  become: true
  command:
    cmd: gpg --dearmor -o /usr/share/keyrings/microsoft.gpg /tmp/microsoft.asc
    creates: /usr/share/keyrings/microsoft.gpg


- name: Add VS Code repository
  become: true
  copy:
    dest: /etc/apt/sources.list.d/vscode.sources
    content: |
      Types: deb
      URIs: https://packages.microsoft.com/repos/code
      Suites: stable
      Components: main
      Architectures: amd64,arm64,armhf
      Signed-By: /usr/share/keyrings/microsoft.gpg


- name: Install VS Code
  become: true
  apt:
    name: code
    state: present
    update_cache: true


- name: Get installed VS Code extensions
  command: code --list-extensions
  register: installed_extensions
  changed_when: false


- name: Install missing VS Code extensions
  command:
    cmd: code --install-extension {{ item }}
  loop: "{{ lookup('file', '../vscode/extensions.txt').splitlines() }}"
  when: item not in installed_extensions.stdout_lines


- name: Install nvm
  become: false
  shell: >
    curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/master/install.sh | bash
  args:
    creates: "{{ ansible_facts['user_dir'] }}/.nvm/nvm.sh"


- name: Install latest LTS Node.js
  shell: |
    source "{{ ansible_facts['user_dir'] }}/.nvm/nvm.sh"
    nvm install --lts
    nvm use --lts
    nvm alias default lts/*
  args:
    executable: /bin/bash
  changed_when: false


- name: Install Codex CLI
  shell: |
    source "{{ ansible_facts['user_dir'] }}/.nvm/nvm.sh"
    npm install -g @openai/codex
  args:
    executable: /bin/bash


- name: Restow dotfiles
  become: false
  shell: stow --restow -t {{ ansible_facts['user_dir'] }} */
  args:
    chdir: "{{ ansible_facts['user_dir'] }}/machine-setup/env"
